[project]
name = "dbtree-lineage"
version = "0.0.1"
description = "Column-level lineage extractor for dbt projects using sqlglot. Phase C of intellij-dbtree."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "kouko" }]
dependencies = [
    "sqlglot>=30.7.0,<31.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-snapshot>=0.9.0",
    "ruff>=0.6.0",
]

[project.scripts]
dbtree-lineage = "dbtree_lineage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtree_lineage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
