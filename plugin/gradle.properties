group = dev.kouko.intellijdbtree
version = 0.4.2

# Plugin metadata
pluginId = dev.kouko.intellij-dbtree
pluginName = dbtree
pluginVendor = kouko

# Target IDE: DataSpell 2026.1.1 (build 261). sinceBuild = 261, no untilBuild ceiling.
platformType = DS
platformVersion = 2026.1.1
pluginSinceBuild = 261

# JVM
javaVersion = 21
kotlinJvmTarget = 21

# Don't bundle Kotlin stdlib — IntelliJ Platform supplies a compatible one.
kotlin.stdlib.default.dependency = false

# Gradle perf
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=512m
