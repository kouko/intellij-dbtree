name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: python-sidecar/uv.lock

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Frontend — install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend — run unit tests
        working-directory: frontend
        run: pnpm run test

      - name: Sidecar — install
        working-directory: python-sidecar
        run: uv sync --extra dev

      - name: Sidecar — run tests
        working-directory: python-sidecar
        run: uv run pytest

      - name: Plugin — run unit tests
        working-directory: plugin
        run: ./gradlew --no-daemon --stacktrace test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            plugin/build/reports/tests/
            plugin/build/test-results/
          if-no-files-found: ignore

      - name: Plugin — buildPlugin
        working-directory: plugin
        run: ./gradlew --no-daemon --stacktrace buildPlugin

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: intellij-dbtree-${{ github.sha }}
          path: plugin/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
