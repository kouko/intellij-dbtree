name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches gradle.properties version
        working-directory: ${{ github.workspace }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gradle_version=$(awk -F'= *' '/^version[[:space:]]*=/ { print $2; exit }' plugin/gradle.properties | tr -d '[:space:]')
          if [ "$tag_version" != "$gradle_version" ]; then
            echo "::error::Tag version ($tag_version) does not match plugin/gradle.properties version ($gradle_version). Bump the version, commit, then re-tag." >&2
            exit 1
          fi
          echo "Releasing version $gradle_version"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier/ides
          key: pluginVerifier-${{ runner.os }}-DS-2026.1.1

      - name: Build plugin
        run: ./gradlew --no-daemon --stacktrace buildPlugin

      - name: Verify plugin against DataSpell 2026.1.1
        run: ./gradlew --no-daemon --stacktrace verifyPlugin

      - name: Upload verifier reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: plugin/build/reports/pluginVerifier/
          if-no-files-found: ignore

      - name: Create GitHub Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            plugin/build/distributions/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # Regenerate the custom-plugin-repository XML so it points at the
      # zip we just published. This is the file users reference from
      # JetBrains IDE → Settings → Plugins → ⚙ → Manage Plugin
      # Repositories…, served by GitHub Pages from main/docs/.
      #
      # We commit back to main directly. The push uses the default
      # GITHUB_TOKEN which deliberately won't trigger another workflow
      # run, so this doesn't loop. The build workflow has a different
      # path (PR + push to main paths) and treats this as a normal
      # source update.
      - name: Update custom plugin repository XML
        working-directory: ${{ github.workspace }}
        run: ./scripts/update-plugin-repo.sh "$GITHUB_REF_NAME"

      - name: Commit and push updatePlugins.xml back to main
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet docs/updatePlugins.xml; then
            echo "updatePlugins.xml unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          ./scripts/update-plugin-repo.sh "$GITHUB_REF_NAME"
          git add docs/updatePlugins.xml
          git commit -m "chore: update plugin repository XML for $GITHUB_REF_NAME [skip ci]"
          git push origin main
